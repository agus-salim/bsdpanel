# ==============================================================================
# FreeBSD Least-Privilege Rules for BSD Panel
# File Location: /usr/local/etc/doas.conf
# ==============================================================================
# The panel daemon runs as unprivileged user 'bsdpanel'.
# Only these specific administrative utilities are permitted without password:

# 1. User & Group provisioning for new websites
permit nopass bsdpanel as root cmd /usr/sbin/pw
permit nopass bsdpanel as root cmd /usr/sbin/chown
permit nopass bsdpanel as root cmd /bin/chmod
permit nopass bsdpanel as root cmd /bin/mkdir

# 2. FreeBSD Service management (rc.d) and rc.conf modification (sysrc)
permit nopass bsdpanel as root cmd /usr/sbin/service
permit nopass bsdpanel as root cmd /usr/sbin/sysrc

# 3. FreeBSD Package management
permit nopass bsdpanel as root cmd /usr/sbin/pkg

# 4. Firewall (PF) reload and testing
permit nopass bsdpanel as root cmd /sbin/pfctl
permit nopass bsdpanel as root cmd /bin/cp args /tmp/pf.conf.test /etc/pf.conf

# 5. Let's Encrypt SSL issuance
permit nopass bsdpanel as root cmd /usr/local/bin/certbot

# 6. Database root administrative commands
permit nopass bsdpanel as root cmd /usr/local/bin/mariadb
permit nopass bsdpanel as root cmd /usr/local/bin/mariadb-dump
permit nopass bsdpanel as postgres cmd /usr/local/bin/psql

# 7. Isolated execution inside tenant account contexts
permit nopass bsdpanel as any
