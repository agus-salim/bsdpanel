# ==============================================================================
# FreeBSD Nginx Reverse Proxy Configuration for BSD Panel
# File Location: /usr/local/etc/nginx/conf.d/bsdpanel.conf
# ==============================================================================

# Rate limiting zone for panel authentication & protection
limit_req_zone $binary_remote_addr zone=panel_limit:10m rate=10r/s;

upstream bsdpanel_backend {
    server 127.0.0.1:8880;
    keepalive 32;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name panel.yourdomain.com; # Ganti dengan domain khusus panel Anda

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /usr/local/www/challenges;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Reverse Proxy Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.yourdomain.com; # Ganti dengan domain khusus panel Anda

    # SSL Certificates (Let's Encrypt path on FreeBSD)
    ssl_certificate /usr/local/etc/letsencrypt/live/panel.yourdomain.com/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/panel.yourdomain.com/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/bsdpanel_access.log;
    error_log /var/log/nginx/bsdpanel_error.log;

    # Reverse Proxy to Go Daemon
    location / {
        limit_req zone=panel_limit burst=20 nodelay;

        proxy_pass http://bsdpanel_backend;
        proxy_http_version 1.1;

        # WebSocket support (for Web Terminal & live logs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for terminal sessions
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffer configurations
        proxy_buffering off;
    }
}
