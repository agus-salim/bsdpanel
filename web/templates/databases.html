{{template "layout" .}}

{{define "content"}}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-base font-bold text-slate-100">Database Management</h2>
      <p class="text-xs text-slate-400 mt-0.5">Manage MariaDB & PostgreSQL engines with user isolation</p>
    </div>
    <div class="flex gap-2">
      <a href="/phpmyadmin" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-dark-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 flex items-center gap-1.5 transition-all">
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>phpMyAdmin</span>
      </a>
      <a href="/phppgadmin" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-dark-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 flex items-center gap-1.5 transition-all">
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span>phpPgAdmin</span>
      </a>
    </div>
  </div>

  <!-- Create Database Card -->
  <div class="bg-dark-800 border border-slate-700/60 rounded-xl p-5 shadow-sm">
    <div class="border-b border-slate-700/60 pb-3 mb-4">
      <h3 class="text-sm font-bold text-slate-100">Create New Database & User</h3>
      <p class="text-xs text-slate-400 mt-0.5">Provision a dedicated SQL database with restricted user access</p>
    </div>

    <form onsubmit="handleCreateDB(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Engine</label>
        <select id="db_type" class="w-full bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
          <option value="mariadb">MariaDB (MySQL)</option>
          <option value="postgresql">PostgreSQL</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Database Name</label>
        <input type="text" id="db_name" required placeholder="app_db" class="w-full bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Database User</label>
        <input type="text" id="db_user" required placeholder="app_user" class="w-full bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">User Password</label>
        <div class="flex gap-2">
          <input type="password" id="db_password" required placeholder="Strong Password" class="flex-1 bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
          <button type="submit" class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white whitespace-nowrap transition-all shadow-sm cursor-pointer">Create</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
async function handleCreateDB(e) {
  e.preventDefault();
  const payload = {
    type: document.getElementById('db_type').value,
    database: document.getElementById('db_name').value,
    user: document.getElementById('db_user').value,
    password: document.getElementById('db_password').value
  };

  try {
    const res = await fetch('/api/databases', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      alert(`Database ${payload.database} and user ${payload.user} created successfully!`);
      e.target.reset();
    } else {
      const err = await res.text();
      alert(`Failed to create database: ${err}`);
  } catch (err) {
    alert('Network error: ' + err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const user = params.get('user');
  const site = params.get('site');
  if (user) {
    const dbNameInput = document.getElementById('db_name');
    const dbUserInput = document.getElementById('db_user');
    if (dbNameInput && !dbNameInput.value) {
      dbNameInput.value = user + '_db';
    }
    if (dbUserInput && !dbUserInput.value) {
      dbUserInput.value = user;
    }
  }
});
</script>
{{end}}
