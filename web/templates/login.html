<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BSD Panel</title>
  <link rel="stylesheet" href="/static/css/tailwind.min.css">
  <link rel="stylesheet" href="/static/css/fira-sans.css">
</head>
<body class="bg-dark-900 text-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-sm bg-dark-950 border border-slate-800 rounded-2xl p-6 shadow-xl">
    <!-- Header Logo -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-sky-600 flex items-center justify-center text-white shadow-lg font-bold text-lg mb-3">
        BSD
      </div>
      <h1 class="text-lg font-bold text-slate-100">BSD Control Panel</h1>
      <p class="text-xs text-slate-400 mt-1">FreeBSD Lightweight VPS Management</p>
    </div>

    <!-- Error message if invalid credentials -->
    {{if .Error}}
    <div class="mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
      <i data-lucide="alert-triangle" class="w-4 h-4 flex-shrink-0"></i>
      <span>{{.Error}}</span>
    </div>
    {{end}}

    <!-- Login Form -->
    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
        <div class="relative">
          <input type="text" id="username" name="username" required placeholder="pengelola" autocomplete="username"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" name="password" required placeholder="••••••••••••" autocomplete="current-password"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
        </div>
      </div>

      <button type="submit" class="w-full py-2.5 rounded-lg text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white transition-all shadow-md flex items-center justify-center gap-1.5 cursor-pointer mt-2">
        <i data-lucide="lock" class="w-3.5 h-3.5"></i>
        <span>Masuk ke Panel</span>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 text-center text-[11px] text-slate-500 font-mono">
      Non-Root Isolated Environment
    </div>
  </div>

  <script src="/static/js/lucide-offline.js"></script>
</body>
</html>
